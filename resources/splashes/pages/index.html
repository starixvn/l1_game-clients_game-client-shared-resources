<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" id="favicon" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@600&amp;display=swap" rel="stylesheet">
  <title>Splash Page</title>
</head>
<body>
  <div id="splash-logo-container" class="splash-container">
    <div id="splash_logo" class="splash"></div>
    <div id="splash_text" class="splash_text"></div>
    <div class="loading_icon" id="loading_icon"></div>
    <div id="powered-by" class="powered-by"></div>
    <div id="waiting-message" class="waiting-message"></div>
    <div id="percentage" class="percentage"></div>
    <script>
        const scriptTag = document.createElement('script');
        scriptTag.src = `script.js?v=${Date.now()}`;
        document.body.appendChild(scriptTag);
    </script>
</div>
</body>
</html>
